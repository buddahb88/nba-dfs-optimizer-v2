version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nba-dfs-postgres
    environment:
      POSTGRES_USER: nba_dfs
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: nba_dfs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba_dfs -d nba_dfs"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nba-dfs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: nba-dfs-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://nba_dfs:localdev@postgres:5432/nba_dfs
      REDIS_URL: redis://redis:6379
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api/src:/app/apps/api/src:ro
    command: pnpm --filter @nba-dfs/api dev

  # Web Frontend
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: nba-dfs-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../apps/web/src:/app/apps/web/src:ro
    command: pnpm --filter @nba-dfs/web dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: nba-dfs-network
